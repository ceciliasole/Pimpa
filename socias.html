<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pimpa · Socias</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Nunito","Trebuchet MS",Arial,sans-serif;background:#FFF6E5;color:#2d3a4a}
  header{background:#FFE9A6;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:6px solid #4A90D9}
  header h1{margin:0;font-size:20px}
  main{max-width:960px;margin:0 auto;padding:16px}
  button{font:inherit;font-weight:700;border:2px solid #1f4e8c;background:#FFD54F;color:#1f4e8c;border-radius:999px;padding:10px 18px;cursor:pointer}
  button.sec{background:#fff}
  button:disabled{opacity:.5;cursor:default}
  .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .acciones{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eee;vertical-align:top}
  th{font-size:12px;text-transform:uppercase;color:#777}
  .tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
  .ok{background:#E8F6EF;color:#2f6f55}.pend{background:#FFEDE9;color:#b04a35}.err{background:#fde0e0;color:#a11}
  input[type=text],input[type=email]{font:inherit;padding:9px 12px;border:2px solid #ddd;border-radius:12px;min-width:220px}
  #msg{min-height:22px;font-weight:700;margin:8px 0}
  .chico{font-size:12px;color:#777}
  .tabla-wrap{overflow-x:auto}
</style>
</head>
<body>
<header><h1>Pimpa · Socias ✨</h1><button class="sec" id="salir" hidden>Salir</button></header>
<main>
  <div id="login" class="card" hidden>
    <p>Panel para Ceci y Jose. Entrá con tu Gmail.</p>
    <button id="entrar">Entrar con Google</button>
  </div>
  <div id="noauth" class="card" hidden><p>Este mail no tiene permiso para este panel.</p></div>

  <div id="panel" hidden>
    <div id="msg"></div>
    <div class="card">
      <div class="acciones">
        <button id="b-listo">Enviar "Tu lugar está listo"</button>
        <button id="b-pago" class="sec">Registrar pago y habilitar</button>
        <button id="b-conf" class="sec">Enviar "Está confirmado"</button>
        <button id="b-act" class="sec">Actualizar</button>
      </div>
      <p class="chico">Marcá las filas y tocá el botón. Los clics en "Pagar" y "Entrar" se cuentan; las aperturas no son confiables y no las mostramos.</p>
      <div class="tabla-wrap"><table>
        <thead><tr><th></th><th>Mail</th><th>Cupón</th><th>Acceso</th><th>Listo</th><th>Confirmado</th><th>Clics</th></tr></thead>
        <tbody id="filas"></tbody>
      </table></div>
    </div>
    <div class="card">
      <strong>Agregar un mail</strong>
      <div class="acciones" style="margin-top:8px">
        <input type="email" id="n-mail" placeholder="mail@ejemplo.com">
        <input type="text" id="n-cupon" placeholder="Cupón (opcional, ej. JOSE1)" style="min-width:180px">
        <label><input type="checkbox" id="n-prof"> es profesional</label>
        <button id="b-add">Agregar</button>
      </div>
    </div>
  </div>
</main>
<script src="vendor/supabase-2.45.4.js"></script>
<script>
(function(){
  var SB_URL='https://fhzqiuvubcytuewwktyf.supabase.co';
  var SB_KEY='sb_publishable__sz2tzDsQH0If8jjuUGqvg_B_n3taZ9';
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
  var $=function(id){return document.getElementById(id)};
  var datos=[];

  function msg(t,mal){var m=$('msg');m.textContent=t||'';m.style.color=mal?'#a11':'#2f6f55'}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fecha(f){if(!f)return '';var d=new Date(f);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}

  async function iniciar(){
    var r=await sb.auth.getSession();
    var ses=r.data.session;
    if(!ses){$('login').hidden=false;return}
    $('salir').hidden=false;
    var ok=await sb.rpc('es_socia');
    if(ok.error||ok.data!==true){$('noauth').hidden=false;return}
    $('panel').hidden=false;
    cargar();
  }

  async function cargar(){
    msg('Cargando…');
    var r=await sb.rpc('socias_lista');
    if(r.error){msg('Error: '+r.error.message,true);return}
    datos=r.data||[];
    pintar();
    msg(datos.length+' mails');
  }

  function est(estado,fecha_){
    if(!estado)return '<span class="chico">—</span>';
    var c=estado==='enviado'?'ok':(estado==='error'?'err':'pend');
    return '<span class="tag '+c+'">'+esc(estado)+'</span><br><span class="chico">'+esc(fecha(fecha_))+'</span>';
  }

  function pintar(){
    $('filas').innerHTML=datos.map(function(f,i){
      var acceso=f.habilitada;
      return '<tr><td><input type="checkbox" data-i="'+i+'"></td>'
        +'<td>'+esc(f.email)+'</td>'
        +'<td>'+esc(f.cupon||'')+'</td>'
        +'<td>'+(acceso?'<span class="tag ok">habilitada</span>':'<span class="tag pend">pendiente</span>')+'</td>'
        +'<td>'+est(f.listo_estado,f.listo_en)+'</td>'
        +'<td>'+est(f.confirmado_estado,f.confirmado_en)+'</td>'
        +'<td>'+esc((f.clics_pagar||0)+' pagar · '+(f.clics_entrar||0)+' entrar')+'</td></tr>';
    }).join('');
  }

  function elegidos(){
    return Array.prototype.slice.call(document.querySelectorAll('#filas input:checked')).map(function(c){return datos[+c.dataset.i].email});
  }

  async function enviar(plantilla,emails){
    var ses=(await sb.auth.getSession()).data.session;
    var r=await fetch('/api/enviar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ses.access_token},body:JSON.stringify({plantilla:plantilla,emails:emails})});
    var d=await r.json().catch(function(){return{}});
    if(!r.ok)throw new Error(d.error||('Error '+r.status));
    var mal=d.resultados.filter(function(x){return !x.ok});
    if(mal.length)throw new Error(mal.map(function(x){return x.email+': '+x.error}).join(' | '));
    return d.resultados.length;
  }

  async function accion(btn,fn){
    btn.disabled=true;
    try{await fn()}catch(e){msg(e.message,true);btn.disabled=false;await cargar();msg(e.message,true);return}
    btn.disabled=false;
  }

  $('entrar').onclick=function(){
    sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/socias'}});
  };
  $('salir').onclick=async function(){await sb.auth.signOut();location.reload()};
  $('b-act').onclick=cargar;

  $('b-listo').onclick=function(){
    var e=elegidos();if(!e.length){msg('Marcá al menos un mail',true);return}
    if(!confirm('¿Enviar "Tu lugar está listo" a '+e.length+' mail(s)?'))return;
    accion($('b-listo'),async function(){msg('Enviando…');var n=await enviar('listo',e);await cargar();msg('Enviados: '+n)});
  };
  $('b-conf').onclick=function(){
    var e=elegidos();if(!e.length){msg('Marcá al menos un mail',true);return}
    if(!confirm('¿Enviar "Está confirmado" a '+e.length+' mail(s)? Tienen que estar habilitados.'))return;
    accion($('b-conf'),async function(){msg('Enviando…');var n=await enviar('confirmado',e);await cargar();msg('Enviados: '+n)});
  };
  $('b-pago').onclick=function(){
    var e=elegidos();if(!e.length){msg('Marcá al menos un mail',true);return}
    if(!confirm('¿Habilitar a '+e.length+' mail(s)? Después podés enviarles la confirmación.'))return;
    accion($('b-pago'),async function(){
      for(var i=0;i<e.length;i++){
        var r=await sb.rpc('socias_habilitar',{p_email:e[i]});
        if(r.error)throw new Error(e[i]+': '+r.error.message);
      }
      await cargar();msg('Habilitadas: '+e.length+'. Ahora podés enviar "Está confirmado".');
    });
  };
  $('b-add').onclick=function(){
    var m=$('n-mail').value.trim();if(!m){msg('Falta el mail',true);return}
    accion($('b-add'),async function(){
      var r=await sb.rpc('socias_agregar',{p_email:m,p_es_profesional:$('n-prof').checked,p_cupon:$('n-cupon').value.trim()||null});
      if(r.error)throw new Error(r.error.message);
      $('n-mail').value='';$('n-cupon').value='';$('n-prof').checked=false;
      await cargar();msg('Agregado');
    });
  };

  iniciar();
})();
</script>
</body>
</html>
